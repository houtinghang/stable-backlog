# Proposes updates of the pinned actions; every update is reviewed before it
# is merged. Like the development tools, only releases at least two weeks old.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
